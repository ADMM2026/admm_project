services:

  mongo:
    image: mongo:7.0
    container_name: tourism-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mongo-init:
    image: mongo:7.0
    container_name: tourism-mongo-init
    depends_on:
    - mongo
    restart: "no"
    entrypoint: >
      bash -c "
        echo '[mongo-init] Waiting for MongoDB to be ready...';
        until mongosh --host mongo:27017 --eval 'db.adminCommand({ ping: 1 })' > /dev/null 2>&1; do
          echo '[mongo-init] MongoDB not ready yet, retrying in 2s...';
          sleep 2;
        done;
        echo '[mongo-init] MongoDB is ready. Initiating replica set...';
        mongosh --host mongo:27017 --eval '
          try {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
            print(\"[mongo-init] rs.initiate() OK\");
          } catch(e) {
            if (e.codeName === \"AlreadyInitialized\") {
              print(\"[mongo-init] Replica set already initialized, skipping.\");
            } else {
              print(\"[mongo-init] ERROR: \" + e);
              quit(1);
            }
          }
        '
      "

  kafka:
    image: apache/kafka:3.7.0
    container_name: tourism-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - CLUSTER_ID=tourism-cluster-id-12345
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
    container_name: tourism-connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - mongo
      - elasticsearch
      - neo4j
      # - influxdb
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=tourism-connect-group
      - CONFIG_STORAGE_TOPIC=tourism_connect_configs
      - OFFSET_STORAGE_TOPIC=tourism_connect_offsets
      - STATUS_STORAGE_TOPIC=tourism_connect_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - KEY_CONVERTER_SCHEMAS_ENABLE=false
      - VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_PLUGIN_PATH=/kafka/connect,/usr/share/java,/opt/confluent/share/confluent-hub-components

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: tourism-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data 

  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.15.0
  #   container_name: tourism-kibana
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     - elasticsearch
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

  # influxdb:
  #   image: influxdb:2.7
  #   container_name: tourism-influxdb
  #   ports:
  #     - "8086:8086"
  #   environment:
  #     - DOCKER_INFLUXDB_INIT_MODE=setup
  #     - DOCKER_INFLUXDB_INIT_USERNAME=admin
  #     - DOCKER_INFLUXDB_INIT_PASSWORD=admin
  #     - DOCKER_INFLUXDB_INIT_ORG=tourism_org
  #     - DOCKER_INFLUXDB_INIT_BUCKET=tourism_metrics
  #   volumes:
  #     - influxdb-data:/var/lib/influxdb2

  neo4j:
    image: neo4j:5.20
    container_name: tourism-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/adminneo4j
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

volumes:
  mongo-data:
  elasticsearch-data:
  neo4j-data:
  neo4j-logs:
  kafka-data:
  # influxdb-data: